[workspace]
name = "gewu-manimble"
channels = ["conda-forge"]
platforms = [
    { name = "gewu-linux", platform = "linux-64", glibc = "2.28" },
    { name = "gewu-macos", platform = "osx-arm64", macos = "14.0" },
]

[dependencies]
python = "3.11.*"
cairo = "*"
pango = "*"
pycairo = "*"
manimpango = "0.7.1.*"
srt = "3.5.3.*"
font-ttf-dejavu-sans-mono = "*"

[pypi-options]
index-url = "https://pypi.org/simple"

[pypi-dependencies]
manim = "==0.21.0"
manim-slides = "==5.7.0"
pillow = "==12.3.0"
matplotlib = "==3.11.2"
python-pptx = "==1.0.2"
biocartoon = "==0.4.3"
imageio-ffmpeg = "==0.6.0"
