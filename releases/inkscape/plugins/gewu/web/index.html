<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figure layout</title><link rel="stylesheet" href="editor.css"><script type="module" src="editor.mjs"></script></head>
<body>
<header><strong>Figure layout</strong><span id="status" role="status">Connecting…</span></header>
<section id="empty" hidden><label>Width (mm) <input id="new-width" type="number" min="1" max="2000" value="180"></label>
<label>Height (mm) <input id="new-height" type="number" min="1" max="2000" value="120"></label><button id="create">Create figure</button></section>
<main id="editor" hidden>
  <nav aria-label="Figure controls">
    <button id="undo">Undo</button><button id="redo">Redo</button>
    <label>Page <select id="page"></select></label><label>Zoom <input id="zoom" type="range" min="0.5" max="3" step="0.1" value="1"></label>
    <button id="export-svg">Export SVG</button><button id="export-pdf">Export PDF</button><button id="export-png">Export PNG</button>
    <span id="download"></span>
  </nav>
  <p id="conflict" hidden>Document changed outside GeWu. <button id="reload">Load external version</button></p>
  <div class="workspace">
    <section class="viewport" aria-label="Page preview"><div id="canvas" tabindex="0" aria-label="Figure canvas"><img alt="Inkscape rendering of figure"><div id="hits"></div></div></section>
    <aside aria-label="Figure inspector">
      <h2>Objects</h2><div id="objects" aria-label="Figure objects"></div>
      <div id="selection-tools">
        <h3 id="selection">Selection</h3>
        <div class="fields"><label>X (mm) <input id="x" type="number" step="0.1"></label><label>Y (mm) <input id="y" type="number" step="0.1"></label>
        <label>Width (mm) <input id="width" type="number" min="0.1" step="0.1"></label><label>Gap (mm) <input id="gap" type="number" min="0" step="0.1" value="3"></label></div>
        <div class="buttons"><button data-op="left">Align left</button><button data-op="top">Align top</button><button data-op="spread-x">Distribute x</button><button data-op="spread-y">Distribute y</button>
        <button data-op="equalize">Equal width</button><button data-op="group">Group</button><button data-op="ungroup">Ungroup</button><button data-op="front">Bring front</button><button data-op="back">Send back</button>
        <button data-op="lock">Toggle lock</button><button data-op="adopt">Adopt</button><button data-op="delete">Delete</button></div>
      </div>
      <details open><summary>Import panels</summary><label>Workspace assets<textarea id="assets" rows="3" placeholder="plots/panel-a.svg&#10;plots/panel-b.png"></textarea></label><button id="import">Import panels</button></details>
      <details><summary>Text and labels</summary><label>Label text <input id="text" maxlength="2048"></label><label>Text size (mm) <input id="size" type="number" min="0.1" step="0.1" value="3.5"></label><label>Color <input id="color" type="color" value="#17191d"></label>
      <button id="add-text">Add label</button><button id="set-text">Update selected label</button><button id="letter">Label selected A–Z</button></details>
      <details><summary>Page setup</summary><div class="fields"><label>Page width <input id="page-w" type="number" min="1" value="180"></label><label>Page height <input id="page-h" type="number" min="1" value="120"></label><label>Margin <input id="margin" type="number" min="0" value="0"></label><label>Page name <input id="page-name" maxlength="100"></label></div>
      <button id="set-page">Resize single page</button><button id="add-page">Add page</button><button id="rename-page">Rename page</button></details>
      <details><summary>Figure workflow</summary><button id="source-check">Check sources</button><button id="replace">Refresh selected panel</button><button id="quality">Check layout</button>
      <button id="paper">Export for Paper</button><button id="manimble">Export for Manimble</button><p id="report"></p></details>
      <details><summary>Desktop editing</summary><button id="checkout">Check out a copy</button><button id="checkin">Accept saved desktop changes</button><button id="discard">Cancel checkout</button><p id="checkout-path"></p>
      <button id="live-refresh">Read live desktop</button> <label><input type="checkbox" id="live-follow"> Follow desktop</label><p id="live-report" role="status"></p><img id="live-preview" alt="Unsaved native Inkscape preview" hidden></details>
    </aside>
  </div>
</main>
</body></html>
